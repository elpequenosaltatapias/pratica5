name: CI Basic

on:
  push:
    branches: [ desarrollo ]
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory:mini-secure-app

    steps:
        
      - name: Checkout código
        uses: actions/checkout@v4
        
      - name: Crear archivo en servidor otra vez
        run: echo "Estoy en el runner" > prueba_runner.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: node ./node_modules/jest/bin/jest.js

      - name: Escaneo de dependencias
        run: npm audit